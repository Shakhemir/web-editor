<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ filename }}</title>
  <style>
    body { font-family: monospace; font-size: 14px; margin: 20px; }
    header { font-family: sans-serif; margin-bottom: 15px; }
    a { color: #06c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #tables { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      font-family: sans-serif; font-size: 13px; padding: 5px 12px;
      border: 1px solid #bbb; border-radius: 4px; cursor: pointer; background: #f5f5f5;
    }
    .tab.active { background: #037; color: #fff; border-color: #037; }
    .tab .type { opacity: .6; font-size: 11px; margin-left: 4px; }

    #meta { font-family: sans-serif; color: #666; margin: 8px 0; font-size: 13px; }
    #error { color: #b40; font-family: sans-serif; margin: 12px 0; }

    .wrap {
      overflow: auto; max-width: 100%; max-height: 72vh;
      border: 1px solid #ddd; border-radius: 4px;
    }
    table { border-collapse: collapse; font-size: 13px; }
    th, td {
      border: 1px solid #e6e6e6; padding: 4px 8px; text-align: left;
      white-space: pre; vertical-align: top;
      max-width: 460px; overflow: hidden; text-overflow: ellipsis;
    }
    th { position: sticky; top: 0; background: #eef3f8; z-index: 1; }
    tbody tr:nth-child(even) { background: #fafafa; }
    td.null { color: #aaa; font-style: italic; }

    #pager { font-family: sans-serif; margin: 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #pager button { font-family: sans-serif; font-size: 13px; padding: 5px 12px; cursor: pointer; }
    #pager button:disabled { opacity: .5; cursor: default; }
    #page-info { color: #666; font-size: 13px; }
    #goto { display: flex; gap: 6px; align-items: center; }
    #page-input {
      font-family: sans-serif; font-size: 13px; width: 70px;
      padding: 5px 6px; border: 1px solid #bbb; border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <b>🗄 {{ filename }}</b>
    &nbsp;&nbsp;<a href="?path={{ parent | urlencode }}">↑ К папке</a>
    &nbsp;&nbsp;<a href="download?path={{ filename | urlencode }}" target="_blank" rel="noopener">⬇ Скачать файл</a>
    &nbsp;&nbsp;<a href="logout">Выйти</a>
  </header>

  <div id="tables"></div>
  <div id="error"></div>
  <div id="meta"></div>
  <div class="wrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
  <div id="pager">
    <button id="first" onclick="goFirst()" title="В начало">⏮</button>
    <button id="prev" onclick="page(-1)">← Назад</button>
    <button id="next" onclick="page(1)">Вперёд →</button>
    <button id="last" onclick="goLast()" title="В конец">⏭</button>
    <span id="page-info"></span>
    <span id="goto">
      <input id="page-input" type="number" min="1" inputmode="numeric"
             placeholder="стр." onkeydown="if (event.key === 'Enter') goPage()">
      <button onclick="goPage()">Переход</button>
    </span>
  </div>

<script>
  const DB_PATH = {{ filename | tojson }};
  const LIMIT = 50;
  const state = { table: null, offset: 0, total: 0 };

  const el = (id) => document.getElementById(id);

  async function load() {
    el('error').textContent = '';
    const params = new URLSearchParams({ path: DB_PATH, limit: LIMIT, offset: state.offset });
    if (state.table) params.set('table', state.table);
    let data;
    try {
      const res = await fetch('sqlite?' + params.toString());
      data = await res.json();
      if (!res.ok || data.error) {
        el('error').textContent = data.error || `Ошибка (HTTP ${res.status})`;
        return;
      }
    } catch (e) {
      el('error').textContent = 'Сбой запроса: ' + e;
      return;
    }
    state.table = data.table;
    state.total = data.total;
    renderTabs(data.tables);
    renderGrid(data.columns, data.rows);
    renderPager(data);
  }

  function renderTabs(tables) {
    const box = el('tables');
    box.innerHTML = '';
    if (!tables.length) { box.textContent = 'В базе нет таблиц.'; return; }
    for (const t of tables) {
      const b = document.createElement('button');
      b.className = 'tab' + (t.name === state.table ? ' active' : '');
      b.textContent = t.name;
      if (t.type === 'view') {
        const s = document.createElement('span');
        s.className = 'type';
        s.textContent = 'view';
        b.appendChild(s);
      }
      b.onclick = () => {
        if (t.name !== state.table) { state.table = t.name; state.offset = 0; load(); }
      };
      box.appendChild(b);
    }
  }

  function renderGrid(columns, rows) {
    const thead = el('grid').querySelector('thead');
    const tbody = el('grid').querySelector('tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';
    if (!columns.length) return;

    const htr = document.createElement('tr');
    for (const c of columns) {
      const th = document.createElement('th');
      th.textContent = c;
      htr.appendChild(th);
    }
    thead.appendChild(htr);

    for (const row of rows) {
      const tr = document.createElement('tr');
      for (const v of row) {
        const td = document.createElement('td');
        if (v === null) { td.textContent = 'NULL'; td.className = 'null'; }
        else td.textContent = String(v);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  const totalPages = () => Math.max(1, Math.ceil(state.total / LIMIT));
  const currentPage = () => Math.floor(state.offset / LIMIT) + 1;

  function renderPager(data) {
    const from = data.total ? data.offset + 1 : 0;
    const to = data.offset + data.rows.length;
    const pages = totalPages();
    el('page-info').textContent = `${from}–${to} из ${data.total}  ·  стр. ${currentPage()} из ${pages}`;
    const atStart = data.offset <= 0;
    const atEnd = to >= data.total;
    el('first').disabled = atStart;
    el('prev').disabled = atStart;
    el('next').disabled = atEnd;
    el('last').disabled = atEnd;
    const input = el('page-input');
    input.max = pages;
    input.value = currentPage();
  }

  function page(dir) {
    state.offset = Math.max(0, state.offset + dir * LIMIT);
    load();
  }

  function goFirst() { state.offset = 0; load(); }

  function goLast() {
    state.offset = (totalPages() - 1) * LIMIT;
    load();
  }

  function goPage() {
    let p = parseInt(el('page-input').value, 10);
    if (isNaN(p)) return;
    p = Math.min(Math.max(1, p), totalPages());  // зажимаем в допустимый диапазон
    state.offset = (p - 1) * LIMIT;
    load();
  }

  load();
</script>
</body>
</html>
